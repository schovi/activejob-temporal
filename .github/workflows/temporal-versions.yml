name: Temporal SDK Compatibility

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  contract:
    name: Temporal SDK ${{ matrix.temporalio-version }} Contract Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        temporalio-version: ['1.4.0', '1.4.1', '1.5.0', '1.6.0', '1.10.1', '1.11.0']

    env:
      BUNDLE_GEMFILE: gemfiles/temporalio_contract.gemfile
      TEMPORALIO_VERSION: '= ${{ matrix.temporalio-version }}'
      TEST_SUITE: contract

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: false

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Start Temporal test server
        run: |
          docker compose up -d temporal
          for i in {1..120}; do
            if docker compose exec -T temporal temporal operator namespace list >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs temporal
          exit 1

      - name: Configure Temporal test namespace
        run: tools/provision_temporal_test_namespace.sh

      - name: Run contract tests
        run: bundle exec rake spec:contract

      - name: Stop Temporal test server
        if: always()
        run: docker compose down -v
