services:
  temporal:
    container_name: temporal
    image: temporalio/temporal:1.10.0 # Embeds Temporal Server 1.32.2.
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
      - --headless
      - --db-filename=/home/temporal/temporal.db
      - --dynamic-config-value=system.numConsecutiveWorkflowTaskProblemsToTriggerSearchAttribute=1
      - --dynamic-config-value=activity.enableStandalone=true
      - --dynamic-config-value=activity.startDelayEnabled=true
      - --dynamic-config-value=matching.enableFairness=true
    networks:
      - temporal-network
    ports:
      - 7233:7233
    volumes:
      - temporal_data:/home/temporal

  toxiproxy:
    container_name: toxiproxy
    depends_on:
      - temporal
    image: ghcr.io/shopify/toxiproxy:2.13.0
    command: ["-host=0.0.0.0"]
    networks:
      - temporal-network
    ports:
      - 7234:7234
      - 8474:8474

  temporal-ui:
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    image: temporalio/ui:2.56.1
    networks:
      - temporal-network
    ports:
      - 8080:8080

networks:
  temporal-network:
    driver: bridge
    name: temporal-network

volumes:
  temporal_data:
